[project]
name = "ragit"
default_branch = "main"
mode = "monorepo"

[init]
strategy = "balanced"
merge_existing = true

[docs]
entrypoint = "RAGIT.md"
workspace_map = "docs/workspace-map.md"
ingestion_policy = "docs/ragit/ingestion-policy.md"
known_gaps = "docs/known-gaps.md"
adr_dir = "docs/adr"

[storage]
backend = "zvec"
manifest_dir = ".ragit/manifest"
vector_dir = ".ragit/store"

[embedding]
provider = "local-placeholder"
dimensions = 64
version = "v1"

[ingest]
supported_types = ["adr", "prd", "srs", "spec", "plan", "ddd", "glossary", "pbd"]
type_detection = "frontmatter-first"
doc_globs = ["**/*.md", "**/*.mdx"]
include = ["README.md", "docs/**", "apps/**/README.md", "packages/**/README.md"]
exclude = ["**/.git/**", "**/.ragit/**", "**/node_modules/**", "**/dist/**", "**/coverage/**", "**/.next/**"]

[hooks]
post_commit = true
post_merge = true

[retrieval]
alpha = 0.7
top_k = 5
keyword_enabled = true

[memory]
corpus_dir = "docs/memory"
session_dir = ".ragit/memory/sessions"
working_dir = ".ragit/memory/working"
auto_ingest_promotions = true
recall_top_k = 8

[security]
secret_masking = true

[output]
format = "both"
language = "ko"
