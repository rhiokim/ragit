name: docs-gh-pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs-gh-pages.yml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: i18n completeness check (warn-only)
        run: pnpm docs:check:i18n

      - name: Verify command docs coverage
        run: pnpm docs:check:commands

      - name: Build docs
        run: pnpm docs:build

      - name: Verify search indexes
        run: pnpm docs:check:search-index

      - name: Prepare GitHub Pages artifact
        run: |
          set -euo pipefail
          rm -rf .pages-artifact
          mkdir -p .pages-artifact
          cp -R apps/docs/out/. .pages-artifact/
          touch .pages-artifact/.nojekyll
          tar \
            --dereference --hard-dereference \
            --directory .pages-artifact \
            -cvf "$RUNNER_TEMP/github-pages.tar" \
            .

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
