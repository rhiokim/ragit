name: runtime-matrix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: node-22.14-linux-arm64
            os: ubuntu-24.04-arm
            node: 22.14.0
            target: linux/arm64
          - label: node-24-linux-arm64
            os: ubuntu-24.04-arm
            node: 24
            target: linux/arm64
          - label: node-22.14-macos-arm64
            os: macos-latest
            node: 22.14.0
            target: darwin/arm64
          - label: node-24-macos-arm64
            os: macos-latest
            node: 24
            target: darwin/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
          package-manager-cache: false

      - name: Verify runtime target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node --eval 'const actual = `${process.platform}/${process.arch}`; if (actual !== process.env.EXPECTED_TARGET) { throw new Error(`expected ${process.env.EXPECTED_TARGET}, received ${actual}`); }'

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libaio-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify zvec binding
        run: node --input-type=module --eval 'await import("@zvec/zvec")'

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Verify runtime guard
        run: pnpm runtime:verify

      - name: Verify build contract
        run: pnpm build:verify

      - name: Verify pack contract
        run: pnpm pack:verify

      - name: Smoke test packed CLI
        run: pnpm pack:smoke

      - name: Reopen registry baseline store
        run: pnpm pack:upgrade-smoke
